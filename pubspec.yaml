name: mvl_app_core
description: "An App Core features for every app"
version: 3.0.0
homepage: https://github.com/ModelViewLabsOrg/mvl_app_core.git

publish_to: none

module:
  androidX: true

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  material_ui: any

  mvl_lint: 
    git:
      url: https://github.com/ModelViewLabsOrg/mvl_lint
      ref: main

  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  async: ^2.13.1
  badges: ^4.0.1
  clock: ^1.1.3
  collection: ^1.19.1
  device_info_plus: ^13.3.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  equatable: ^3.0.0
  share_plus: ^13.3.1
  talker_flutter: ^5.2.0
  version: ^3.0.2

  firebase_analytics: ^13.0.1
  firebase_remote_config: ^7.0.1
  firebase_crashlytics: ^6.0.1
  firebase_core: ^5.1.0
  firebase_in_app_messaging: ^0.10.1
  firebase_messaging: ^17.0.1

  uuid: ^4.6.0
  url_strategy: ^0.3.0
  sentry_flutter: ^10.3.0
  aptabase_flutter: #^0.4.1
    git:
      url: https://github.com/GabrielRozendo/aptabase_flutter
      ref: main
  jiffy: ^6.4.5
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  overlay_notification: ^23.5.12
  remove_emoji: ^0.0.10
  diacritic: ^0.1.6
  html: ^0.15.7
  in_app_review: ^2.0.12
  # font_awesome_flutter: ^11.0.0
  date_field: ^7.0.0
  ulid: ^2.2.0
  nanoid: ^1.0.0
  universal_io: ^2.3.1
  posthog_flutter: ^5.60.2
  supabase_flutter: ^2.18.3



  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  # generate: true
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: InterVariable
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

    - family: MontserratVariable
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
